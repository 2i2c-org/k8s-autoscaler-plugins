apiVersion: jupyter.org/v1
kind: NodepoolAllocationTarget
metadata:
  name: example-npat
spec:
  nodepoolSelector: topology.kubernetes.io/zone=us-central1-b
  plugins: 
    always_on:
      minimum: 1
    cron:
      jobs:
      - minimum: 2
        schedule: "0-59/1 * * * *" # local testing: run every minute