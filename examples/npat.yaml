apiVersion: jupyter.org/v1
kind: NodepoolAllocationTarget
metadata:
  name: example-npat
spec:
  nodepoolSelector: cloud.google.com/gke-nodepool=test-pool-1
  plugins:
    always_on:
      minimum: 1
    cron:
      jobs:
      - minimum: 0
        schedule: '*/3 * * * *' # local testing: run every 3 minutes
      - minimum: 2
        schedule: '*/2 * * * *' # local testing: run every 2 minutes
